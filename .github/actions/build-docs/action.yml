name: Build Documentation
description: 'Build Documentation.'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.2'
        tools: composer:v2, phpdoc:3.3.1
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install dependencies
      shell: bash
      run: composer install --no-progress --no-dev

    - name: Build Documentation
      shell: bash
      run: |
        phpdoc \
          -d src \
          -t "docs" \
          --ignore-tags psalm-param \
          --ignore-tags psalm-var \
          --ignore-tags psalm-return \
          --visibility public \
          --defaultpackagename "LaunchDarkly" \
          --title "LaunchDarkly PHP OpenTelemetry integration 0.2.0" # x-release-please-version
